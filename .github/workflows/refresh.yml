name: Nightly PSI refresh
on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:00 IST daily
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pandas numpy scikit-learn
      - run: python pipeline/harvest.py && python pipeline/build.py
      - name: Commit if NASA PSI data changed
        run: |
          git config user.name "ember-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data web/public/data
          git diff --cached --quiet || git commit -m "Nightly NASA PSI refresh" && git push
